spring:
  application:
    name: payment-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:qredpayments;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: ${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true
    show-sql: false

  sql:
    init:
      mode: always
      data-locations: classpath:db/migration/V4__insert_dummy_data.sql


server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.dola: DEBUG
